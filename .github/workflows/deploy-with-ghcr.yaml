name: Deploy with GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - "!dependabot/**"
      - main
      - dev

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: go-toolkit

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    needs: verify
    env:
      ENVIRONMENT: |-
        ${{
          github.ref_name == 'main'     && 'PRD'
          || github.ref_name == 'dev'   && 'DEV'
          ||                               'UNKNOWN'
        }}
      IMAGE_TAG: |-
        ${{
          github.ref_name == 'main'     && 'latest'
          || github.ref_name == 'dev'   && 'dev'
          ||                               'latest'
        }}

    steps:
      - name: Validate Environment
        run: |
          if [ "${{ env.ENVIRONMENT }}" == "UNKNOWN" ]; then
            echo "Error: ENVIRONMENT value is set to UNKNOWN."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Swarm
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            # The stack pulls a private image, and Swarm can only pass on
            # credentials the manager already holds.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin

            cd /opt/personal/swarm
            set -a; . ./.env.deploy.${{ env.ENVIRONMENT }}; set +a

            export VERSION="${{ env.IMAGE_TAG }}"

            ./scripts/deploy.sh service go-toolkit

            docker stack services personal-${{ env.ENVIRONMENT }}
