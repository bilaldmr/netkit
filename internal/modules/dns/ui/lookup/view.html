<form>
  <label>Domain <input name="domain" placeholder="google.com" required></label>
  <label class="type">Type
    <select name="type">
      <option value="">All</option>
      <option>A</option><option>AAAA</option><option>CNAME</option><option>MX</option><option>NS</option><option>TXT</option>
    </select>
  </label>
  <label>Server <input name="server" placeholder="1.1.1.1 (empty = system resolver)"></label>
  <button>Lookup</button>
</form>
