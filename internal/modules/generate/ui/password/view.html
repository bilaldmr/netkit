<form>
  <label class="small">
    Length
    <input name="length" type="number" min="8" max="128" value="20" />
  </label>
  <label class="small">
    Count
    <input name="count" type="number" min="1" max="50" value="5" />
  </label>
  <label class="small">
    a–z
    <select name="lower">
      <option value="true">Yes</option>
      <option value="false">No</option>
    </select>
  </label>
  <label class="small">
    A–Z
    <select name="upper">
      <option value="true">Yes</option>
      <option value="false">No</option>
    </select>
  </label>
  <label class="small">
    0–9
    <select name="digits">
      <option value="true">Yes</option>
      <option value="false">No</option>
    </select>
  </label>
  <label class="small">
    Symbols
    <select name="symbols">
      <option value="true">Yes</option>
      <option value="false">No</option>
    </select>
  </label>
  <button>Generate</button>
</form>
