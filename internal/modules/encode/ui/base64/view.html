<form>
  <label class="full">
    Input
    <textarea name="input" required></textarea>
  </label>
  <label class="small">
    Mode
    <select name="mode">
      <option value="encode">Encode</option>
      <option value="decode">Decode</option>
    </select>
  </label>
  <label class="small">
    Alphabet
    <select name="url_safe">
      <option value="false">Standard</option>
      <option value="true">URL-safe</option>
    </select>
  </label>
  <button>Run</button>
</form>
